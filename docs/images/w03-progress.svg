<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="940" height="560" fill="#ffffff"/>

  <text x="36" y="46" font-size="21" font-weight="700" fill="#16181d">3주차 진행 사항</text>
  <text x="36" y="70" font-size="13" fill="#8b8f9a">2026-10-19 · 영어 회화 연습 서비스</text>

  <rect x="36" y="92" width="868" height="36" fill="#f3f4f6"/>
  <text x="52"  y="115" font-size="13" font-weight="600" fill="#50555f">항목</text>
  <text x="250" y="115" font-size="13" font-weight="600" fill="#50555f">한 일</text>
  <text x="620" y="115" font-size="13" font-weight="600" fill="#50555f">결과</text>
  <line x1="36" y1="128" x2="904" y2="128" stroke="#d8dade" stroke-width="1"/>

  <g font-size="13" fill="#2b2e35">
    <text x="52"  y="156">서버</text>
    <text x="250" y="156" fill="#50555f">내 노트북에서 먼저 측정 (AWS는 추후 판단)</text>
    <text x="620" y="156">하려던 실험 8개 전부 가능</text>
    <line x1="36" y1="172" x2="904" y2="172" stroke="#eceef1"/>

    <text x="52"  y="200" font-weight="600" fill="#b4341f">재사용</text>
    <text x="250" y="200" fill="#50555f">같은 문장 재사용이 안 되고 있던 것 발견</text>
    <text x="620" y="200" font-weight="600">안내문 265 → 1,557자로 늘려 해결</text>
    <line x1="36" y1="216" x2="904" y2="216" stroke="#eceef1"/>

    <text x="52"  y="244">모델</text>
    <text x="250" y="244" fill="#50555f">더 싸고 할인 큰 모델로 교체</text>
    <text x="620" y="244">값 1/4, 재사용 할인 75% → 90%</text>
    <line x1="36" y1="260" x2="904" y2="260" stroke="#eceef1"/>

    <text x="52"  y="288">무료 전환</text>
    <text x="250" y="288" fill="#50555f">돈 내기 전까지 무료 서비스로</text>
    <text x="620" y="288">문서 속 모델명이 안 먹혀 직접 목록 조회</text>
    <line x1="36" y1="304" x2="904" y2="304" stroke="#eceef1"/>

    <text x="52"  y="332">기록</text>
    <text x="250" y="332" fill="#50555f">재사용 수치를 세 가지로 구분</text>
    <text x="620" y="332">"재사용 못 함"과 "잴 수 없음" 분리</text>
    <line x1="36" y1="348" x2="904" y2="348" stroke="#eceef1"/>

    <text x="52"  y="376">서비스</text>
    <text x="250" y="376" fill="#50555f">웹 화면까지 만들어 동작 확인</text>
    <text x="620" y="376">대화하면서 수치가 바로 보임</text>
    <line x1="36" y1="392" x2="904" y2="392" stroke="#eceef1"/>

    <text x="52"  y="420">비용</text>
    <text x="250" y="420" fill="#50555f">돈 내고 쓸 구간 미리 계산</text>
    <text x="620" y="420">960번 호출에 약 139원</text>
    <line x1="36" y1="436" x2="904" y2="436" stroke="#d8dade"/>
  </g>

  <text x="36" y="474" font-size="14" font-weight="700" fill="#16181d">첫 측정 — 대화가 길어질수록 보내는 글자가 늘어남</text>

  <g font-size="12">
    <text x="36" y="508" fill="#50555f">1번째</text>
    <rect x="82" y="496" width="296" height="16" rx="3" fill="#c8d4f0"/>
    <text x="388" y="508" fill="#2b2e35" font-weight="600">1,225</text>

    <text x="36" y="530" fill="#50555f">2번째</text>
    <rect x="82" y="518" width="305" height="16" rx="3" fill="#9db4e8"/>
    <text x="397" y="530" fill="#2b2e35" font-weight="600">1,262</text>

    <text x="36" y="552" fill="#50555f">3번째</text>
    <rect x="82" y="540" width="318" height="16" rx="3" fill="#6f90de"/>
    <text x="410" y="552" fill="#2b2e35" font-weight="600">1,312</text>
  </g>

  <text x="620" y="508" font-size="12" fill="#50555f">한 번 주고받을 때마다 40~50씩 증가</text>
  <text x="620" y="530" font-size="12" fill="#50555f">첫 글자까지 0.68초 / 전체 0.72초</text>
  <text x="620" y="552" font-size="12" fill="#8b8f9a">2주차에 세운 예상과 일치</text>
</svg>
